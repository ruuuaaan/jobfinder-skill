name: Skill checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r jobfinder/requirements.txt
      - name: Portable package and offline pipeline
        run: python scripts/smoke_release.py
      - name: Controller and core tests
        shell: bash
        run: |
          status=0
          python -m unittest discover -s jobfinder/tests -v > unit-tests.log 2>&1 || status=$?
          tail -60 unit-tests.log
          if [ "$status" -ne 0 ]; then
            python scripts/ci_report.py unit-tests.log
          fi
          exit "$status"
